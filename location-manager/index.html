<!doctype html><html><head><meta charset="utf-8"><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px;color:#252631}.card{border:1px solid #ddd;border-radius:12px;padding:18px}.path{color:#666;margin:6px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:.82rem;font-weight:650;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:7px}button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:#16b378;color:#fff;font-weight:700}.status{margin-top:12px;padding:10px;border-radius:8px}.ok{background:#eaf8f2;color:#136846}.err{background:#fdeeee;color:#962828}.small{font-size:.8rem;color:#777;margin-top:6px}</style></head>
<body><div id="app" class="card">Select a location in the linked Location Inventory widget.</div>
<script>
const CAND=['Location_Inventory','LocationInventory','Locations'];let current=null,tableId=null,cols=new Set(),busy=false,allRows=[];
const allowed={Room:['Freezer','Fridge','Cabinet','Bench','Shelf','Rack','Box','Bag'],Freezer:['Shelf','Rack','Box','Bag'],Fridge:['Shelf','Rack','Box','Bag'],Cabinet:['Shelf','Rack','Box','Bag'],Bench:['Rack','Box','Bag'],Shelf:['Rack','Box','Bag'],Rack:['Box','Bag'],Box:['Box','Bag'],Bag:['Box','Bag']};
grist.ready({requiredAccess:'full'});
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function findTable(){const ts=await grist.docApi.listTables();for(const c of CAND)if(ts.includes(c))return c;for(const id of ts){try{const t=await grist.docApi.fetchTable(id),c=new Set(Object.keys(t));if(c.has('ParentLocationID')&&c.has('Type')&&c.has('Name'))return id}catch(e){}}return null}
async function ensure(){if(!tableId)tableId=await findTable();if(!tableId)throw new Error('Location table not found');const t=await grist.docApi.fetchTable(tableId);cols=new Set(Object.keys(t));allRows=t.id.map((id,i)=>{const r={id};for(const [k,col] of Object.entries(t))if(k!=='id'&&Array.isArray(col))r[k]=col[i];return r})}
function addField(o,k,v){if(cols.has(k)&&v!==''&&v!=null)o[k]=v}
function render(r){current=r;if(!r||!r.id){document.getElementById('app').innerHTML='Select a location in the linked Location Inventory widget.';return}
const types=allowed[String(r.Type||'')]||['Shelf','Rack','Box','Bag'];
document.getElementById('app').innerHTML=`<div><b>${r.Name||r.LocationID||'Selected location'}</b></div><div class="path">${r.Description||r.LocationID||''}</div>
<div class="grid"><div><label>Child type</label><select id="ct">${types.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Name</label><input id="nm" placeholder="e.g. Antibody Box"></div></div>
<div id="extra" style="margin-top:12px"></div><div style="margin-top:12px"><label>Position (optional)</label><input id="position" type="number" min="1" placeholder="Blank = first available"><div class="small">Positions fill left-to-right, then top-to-bottom.</div></div><button id="go">CREATE CHILD HERE</button><button id="relocate" style="background:#eef1f4;color:#30343a">RELOCATE THIS LOCATION</button><div id="relocatePanel" style="display:none;margin-top:12px"><label>Search new parent</label><input id="parentSearch" placeholder="Search room, freezer, shelf, rack..."><select id="parentSelect" style="margin-top:6px"></select><button id="confirmMove" style="background:#52606d">MOVE HERE</button></div><div class="small">Parent is the currently selected location.</div><div id="msg"></div>`;
document.getElementById('ct').onchange=extra;document.getElementById('go').onclick=create;document.getElementById('relocate').onclick=openRelocate;extra()}
function extra(){const t=document.getElementById('ct').value,e=document.getElementById('extra');if(['Box','Rack'].includes(t))e.innerHTML='<div class="grid"><div><label>Rows</label><input id="rows" type="number" value="9"></div><div><label>Columns</label><input id="cols" type="number" value="9"></div></div>';else if(['Freezer','Fridge','Cabinet'].includes(t))e.innerHTML=`<div class="grid">${['Freezer','Fridge'].includes(t)?'<div><label>Temperature °C</label><input id="temp" type="number"></div>':''}<div><label>Number of shelves</label><input id="shelves" type="number" value="0"></div></div>`;else e.innerHTML=''}
function msg(s,c){document.getElementById('msg').innerHTML=`<div class="status ${c}">${s}</div>`}
function locLabel(r){return r.Description||r.Name||r.LocationID||`row ${r.id}`}
function refreshParents(){const q=String(document.getElementById('parentSearch')?.value||'').toLowerCase().trim(),sel=document.getElementById('parentSelect');if(!sel)return;const rows=allRows.filter(r=>Number(r.id)!==Number(current?.id)&&(!q||locLabel(r).toLowerCase().includes(q)));sel.innerHTML='';for(const r of rows){const o=document.createElement('option');o.value=String(r.id);o.textContent=locLabel(r);sel.appendChild(o)}}
function openRelocate(){if(!current)return;if(String(current.Type||'')==='Room')return msg('Rooms are root locations and cannot be relocated.','err');const p=document.getElementById('relocatePanel');p.style.display=p.style.display==='none'?'block':'none';if(p.style.display==='block'){document.getElementById('parentSearch').oninput=refreshParents;document.getElementById('confirmMove').onclick=moveLocation;refreshParents()}}
async function moveLocation(){const target=Number(document.getElementById('parentSelect')?.value||0);if(!target)return msg('Choose a new parent location.','err');const tr=allRows.find(r=>Number(r.id)===target),type=String(current.Type||'');const warning=(type==='Freezer'||type==='Fridge')?'\n\nWARNING: moving this Freezer/Fridge changes the physical path for every descendant.':'';if(!confirm(`Relocate ${locLabel(current)} to:\n\n${locLabel(tr)}?${warning}`))return;try{await grist.getTable(tableId).update({id:Number(current.id),fields:{ParentLocationID:target}});msg('Location relocated.','ok')}catch(e){msg('Could not relocate location: '+(e.message||e),'err')}}
function parentChildren(parentId){return allRows.filter(r=>Number(r.ParentLocationID)===Number(parentId))}
function firstAvailablePosition(parentId){
 const used=new Set(parentChildren(parentId).map(r=>Number(r.Position)).filter(p=>Number.isInteger(p)&&p>0));
 let p=1;while(used.has(p))p++;return p;
}
async function create(){if(busy)return;try{await ensure();const parent=Number(current.id),type=document.getElementById('ct').value,name=document.getElementById('nm').value.trim();if(!confirm(`Create ${type} under\n${current.Description||current.Name||current.LocationID}?`))return;busy=true;const ops=grist.getTable(tableId),f={};addField(f,'ParentLocationID',parent);addField(f,'Type',type);addField(f,'Name',name);let pos=Number(document.getElementById('position')?.value||0);if(!Number.isInteger(pos)||pos<1)pos=firstAvailablePosition(parent);addField(f,'Position',pos);
if(['Box','Rack'].includes(type)){addField(f,'Rows',Number(document.getElementById('rows').value));addField(f,'Columns',Number(document.getElementById('cols').value))}
if(['Freezer','Fridge'].includes(type)){const v=document.getElementById('temp')?.value;if(v!=='')addField(f,'Temperature_C',Number(v))}
let n=0;if(['Freezer','Fridge','Cabinet'].includes(type)){n=Number(document.getElementById('shelves')?.value||0);addField(f,'NumberOfShelves',n)}
const rec=await ops.create({fields:f});for(let i=1;i<=n;i++){const sf={};addField(sf,'ParentLocationID',rec.id);addField(sf,'Type','Shelf');addField(sf,'Name',`Shelf ${i}`);await ops.create({fields:sf})}
msg(`Created ${type}${name?` "${name}"`:''}${n?` and ${n} shelf record(s)`:''}.`,'ok')}catch(e){msg('Could not create location: '+(e.message||e),'err')}finally{busy=false}}
ensure().catch(()=>{});grist.onRecord(render);
</script></body></html>

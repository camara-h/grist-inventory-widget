<!doctype html><html><head><meta charset="utf-8"><script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px;color:#252631}.card{border:1px solid #ddd;border-radius:12px;padding:18px}.path{color:#666;margin:6px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:.82rem;font-weight:650;margin-bottom:5px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:7px}button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:#16b378;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#eef1f4;color:#30343a}.dark{background:#52606d}.danger{background:#9e4040}.status{margin-top:12px;padding:10px;border-radius:8px}.ok{background:#eaf8f2;color:#136846}.err{background:#fdeeee;color:#962828}.warn{background:#fff6dc;color:#765600}.small{font-size:.8rem;color:#777;margin-top:6px}.section{border-top:1px solid #eee;margin-top:18px;padding-top:16px}.preview{border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:10px;font-size:.83rem}.bad{color:#9e3030;font-weight:700}.good{color:#136846;font-weight:700}</style></head>
<body><div id="app" class="card">Select a location in the linked Location Inventory widget.</div>
<script>
const CAND=['Location_Inventory','LocationInventory','Locations'],INV='Inventory',EVENTS='Events';
let current=null,tableId=null,cols=new Set(),allRows=[],invRows=[],eventCols=new Set(),busy=false;
const allowed={Room:['Freezer','Fridge','Cabinet','Bench','Shelf','Rack','Box','Bag'],Freezer:['Shelf','Rack','Box','Bag'],Fridge:['Shelf','Rack','Box','Bag'],Cabinet:['Shelf','Rack','Box','Bag'],Bench:['Rack','Box','Bag'],Shelf:['Rack','Box','Bag'],Rack:['Box','Bag'],Box:['Box','Bag'],Bag:['Box','Bag']};
grist.ready({requiredAccess:'full'});
function refNum(v){if(typeof v==='number')return v;if(Array.isArray(v)&&v[0]==='R')return Number(v[1]);const n=Number(v);return Number.isFinite(n)&&n>0?n:null}
async function findTable(){const ts=await grist.docApi.listTables();for(const c of CAND)if(ts.includes(c))return c;for(const id of ts){try{const t=await grist.docApi.fetchTable(id),c=new Set(Object.keys(t));if(c.has('ParentLocationID')&&c.has('Type')&&c.has('Name'))return id}catch(e){}}return null}
function rowify(t){return t.id.map((id,i)=>{const r={id};for(const [k,c] of Object.entries(t))if(k!=='id'&&Array.isArray(c))r[k]=c[i];return r})}
async function ensure(){if(!tableId)tableId=await findTable();if(!tableId)throw new Error('Location table not found');const [t,it]=await Promise.all([grist.docApi.fetchTable(tableId),grist.docApi.fetchTable(INV)]);cols=new Set(Object.keys(t));allRows=rowify(t);invRows=rowify(it);try{eventCols=new Set(Object.keys(await grist.docApi.fetchTable(EVENTS)))}catch(e){eventCols=new Set()}}
function addField(o,k,v){if(cols.has(k)&&v!==''&&v!=null)o[k]=v}
function locLabel(r){return r?.Description||r?.Name||r?.LocationID||`row ${r?.id}`}
function msg(s,c){document.getElementById('msg').innerHTML=`<div class="status ${c}">${s}</div>`}
function children(parentId){return allRows.filter(r=>refNum(r.ParentLocationID)===Number(parentId))}
function items(parentId){return invRows.filter(r=>String(r.Status||'').trim().toLowerCase()==='active'&&refNum(r.LocationID)===Number(parentId))}
function capacity(r){const rr=Number(r?.Rows),cc=Number(r?.Columns);return Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0?rr*cc:null}
function contents(parentId){return [...children(parentId).map(r=>({kind:'Location',id:r.id,name:r.Name||r.LocationID||`row ${r.id}`,pos:Number(r.Position)})),...items(parentId).map(r=>({kind:'Item',id:r.id,name:r.ItemName||r.ItemID||`row ${r.id}`,pos:Number(r.Position)}))]}
function occupancyIssues(parentId,rows,columns){const cap=(rows>0&&columns>0)?rows*columns:null,seen=new Map(),bad=[];for(const o of contents(parentId)){if(!Number.isInteger(o.pos)||o.pos<1||(cap&&o.pos>cap)){bad.push({...o,reason:cap&&o.pos>cap?`position ${o.pos} > ${cap}`:'missing/invalid position'});continue}if(seen.has(o.pos)){bad.push({...o,reason:`position ${o.pos} collision`});bad.push({...seen.get(o.pos),reason:`position ${o.pos} collision`})}else seen.set(o.pos,o)}return [...new Map(bad.map(x=>[`${x.kind}:${x.id}`,x])).values()]}
function firstAvailable(parentId){const used=new Set(contents(parentId).map(o=>o.pos).filter(p=>Number.isInteger(p)&&p>0));let p=1;while(used.has(p))p++;return p}
function validatePosition(parentId,pos){const parent=allRows.find(r=>Number(r.id)===Number(parentId)),cap=capacity(parent);if(!Number.isInteger(pos)||pos<1)return 'Position must be a positive whole number.';if(cap&&pos>cap)return `Position ${pos} does not exist in this ${parent.Rows} × ${parent.Columns} location. Valid positions are 1–${cap}.`;if(contents(parentId).some(o=>o.pos===pos))return `Position ${pos} is already occupied.`;return null}
function existingEvent(fields){const o={};for(const [k,v] of Object.entries(fields))if(eventCols.has(k)&&v!==undefined&&v!==null)o[k]=v;return o}
async function event(fields){if(!eventCols.size)return;const f=existingEvent(fields);if(Object.keys(f).length)await grist.getTable(EVENTS).create({fields:f})}

function render(r){current=r;if(!r||!r.id){document.getElementById('app').innerHTML='Select a location in the linked Location Inventory widget.';return}
const types=allowed[String(r.Type||'')]||['Shelf','Rack','Box','Bag'];
document.getElementById('app').innerHTML=`<div><b>${r.Name||r.LocationID||'Selected location'}</b></div><div class="path">${r.Description||r.LocationID||''}</div>
<div class="section" style="border-top:0;margin-top:0;padding-top:0"><b>Create Child Location</b>
<div class="grid" style="margin-top:10px"><div><label>Child type</label><select id="ct">${types.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Name</label><input id="nm" placeholder="e.g. Antibody Box"></div></div>
<div id="extra" style="margin-top:12px"></div><div style="margin-top:12px"><label>Position (optional)</label><input id="position" type="number" min="1" placeholder="Blank = first available"><div class="small">The widget validates the parent Rows × Columns and occupied positions.</div></div><button id="go">CREATE CHILD HERE</button></div>

<div class="section"><b>Relocate Selected Location</b><button id="relocate" class="secondary">RELOCATE THIS LOCATION</button><div id="relocatePanel" style="display:none;margin-top:12px"><label>Search new parent</label><input id="parentSearch" placeholder="Search room, freezer, shelf, rack..."><select id="parentSelect" style="margin-top:6px"></select><div style="margin-top:10px"><label>Position in new parent</label><input id="movePosition" type="number" min="1" placeholder="Blank = first available"></div><button id="confirmMove" class="dark">MOVE HERE</button></div></div>

<div class="section"><b>Edit Selected Location</b><div class="small">Useful for boxes/racks and any location using a Rows × Columns grid.</div>
<div class="grid" style="margin-top:10px"><div><label>Rows</label><input id="editRows" type="number" min="1" value="${r.Rows||''}"></div><div><label>Columns</label><input id="editCols" type="number" min="1" value="${r.Columns||''}"></div></div>
<div id="preview" class="preview"></div><button id="saveDimensions" class="dark">SAVE DIMENSIONS</button><button id="repack" class="secondary">SAVE + REPACK CONTENTS</button></div>
<div id="msg"></div>`;
document.getElementById('ct').onchange=extra;document.getElementById('go').onclick=create;document.getElementById('relocate').onclick=openRelocate;document.getElementById('editRows').oninput=preview;document.getElementById('editCols').oninput=preview;document.getElementById('saveDimensions').onclick=()=>saveDimensions(false);document.getElementById('repack').onclick=()=>saveDimensions(true);extra();preview()}

function extra(){const t=document.getElementById('ct').value,e=document.getElementById('extra');if(['Box','Rack'].includes(t))e.innerHTML='<div class="grid"><div><label>Rows</label><input id="rows" type="number" min="1" value="9"></div><div><label>Columns</label><input id="cols" type="number" min="1" value="9"></div></div>';else if(['Freezer','Fridge','Cabinet'].includes(t))e.innerHTML=`<div class="grid">${['Freezer','Fridge'].includes(t)?'<div><label>Temperature °C</label><input id="temp" type="number"></div>':''}<div><label>Number of shelves</label><input id="shelves" type="number" min="0" value="0"></div></div>`;else e.innerHTML=''}

function refreshParents(){const q=String(document.getElementById('parentSearch')?.value||'').toLowerCase().trim(),sel=document.getElementById('parentSelect');if(!sel)return;const rows=allRows.filter(r=>Number(r.id)!==Number(current?.id)&&(!q||locLabel(r).toLowerCase().includes(q)));sel.innerHTML='';for(const r of rows){const o=document.createElement('option');o.value=String(r.id);o.textContent=locLabel(r);sel.appendChild(o)}}
function openRelocate(){if(!current)return;if(String(current.Type||'')==='Room')return msg('Rooms are root locations and cannot be relocated.','err');const p=document.getElementById('relocatePanel');p.style.display=p.style.display==='none'?'block':'none';if(p.style.display==='block'){document.getElementById('parentSearch').oninput=refreshParents;document.getElementById('confirmMove').onclick=moveLocation;refreshParents()}}
async function moveLocation(){const target=Number(document.getElementById('parentSelect')?.value||0);if(!target)return msg('Choose a new parent location.','err');let pos=Number(document.getElementById('movePosition')?.value||0);if(!Number.isInteger(pos)||pos<1)pos=firstAvailable(target);const problem=validatePosition(target,pos);if(problem)return msg(problem,'err');const tr=allRows.find(r=>Number(r.id)===target),old=allRows.find(r=>Number(r.id)===refNum(current.ParentLocationID));if(!confirm(`Relocate ${locLabel(current)} to:\n\n${locLabel(tr)}\nPosition ${pos}?`))return;try{await grist.getTable(tableId).update({id:Number(current.id),fields:{ParentLocationID:target,Position:pos}});await event({Location:Number(current.id),EventType:'Location Relocated',Notes:`Location ${current.LocationID||current.Name} moved from ${locLabel(old)} position ${current.Position||'blank'} to ${locLabel(tr)} position ${pos}`});msg('Location relocated.','ok');await ensure()}catch(e){msg('Could not relocate location: '+(e.message||e),'err')}}

async function create(){if(busy)return;try{await ensure();const parent=Number(current.id),type=document.getElementById('ct').value,name=document.getElementById('nm').value.trim();let pos=Number(document.getElementById('position')?.value||0);if(!Number.isInteger(pos)||pos<1)pos=firstAvailable(parent);const problem=validatePosition(parent,pos);if(problem)return msg(problem,'err');const f={};addField(f,'ParentLocationID',parent);addField(f,'Type',type);addField(f,'Name',name);addField(f,'Position',pos);if(['Box','Rack'].includes(type)){const rr=Number(document.getElementById('rows').value),cc=Number(document.getElementById('cols').value);if(!(rr>0&&cc>0))return msg('Rows and Columns must both be positive numbers.','err');addField(f,'Rows',rr);addField(f,'Columns',cc)}if(['Freezer','Fridge'].includes(type)){const v=document.getElementById('temp')?.value;if(v!=='')addField(f,'Temperature_C',Number(v))}let n=0;if(['Freezer','Fridge','Cabinet'].includes(type)){n=Number(document.getElementById('shelves')?.value||0);addField(f,'NumberOfShelves',n)}
if(!confirm(`Create ${type} under\n${current.Description||current.Name||current.LocationID}\nat position ${pos}?`))return;busy=true;const rec=await grist.getTable(tableId).create({fields:f});for(let i=1;i<=n;i++){const sf={};addField(sf,'ParentLocationID',rec.id);addField(sf,'Type','Shelf');addField(sf,'Name',`Shelf ${i}`);addField(sf,'Position',i);await grist.getTable(tableId).create({fields:sf})}msg(`Created ${type}${name?` "${name}"`:''} at position ${pos}.`,'ok');await ensure()}catch(e){msg('Could not create location: '+(e.message||e),'err')}finally{busy=false}}

function preview(){const rr=Number(document.getElementById('editRows')?.value||0),cc=Number(document.getElementById('editCols')?.value||0),e=document.getElementById('preview');if(!(rr>0&&cc>0)){e.innerHTML='Enter Rows and Columns to preview.';return}const cap=rr*cc,cont=contents(current.id),bad=occupancyIssues(current.id,rr,cc);let h=`New grid: <b>${rr} × ${cc} = ${cap} positions</b><br>Current direct contents: <b>${cont.length}</b>`;if(cont.length>cap)h+=`<br><span class="bad">Cannot fit: ${cont.length-cap} too many objects.</span>`;else if(bad.length)h+=`<br><span class="bad">${bad.length} record(s) would have invalid/colliding positions.</span><br>`+bad.slice(0,12).map(x=>`${x.kind}: ${x.name} (${x.reason})`).join('<br>');else h+=`<br><span class="good">All current positions remain valid.</span>`;e.innerHTML=h}
async function saveDimensions(repack){try{await ensure();const rr=Number(document.getElementById('editRows').value),cc=Number(document.getElementById('editCols').value);if(!(Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0))return msg('Rows and Columns must be positive whole numbers.','err');const cont=contents(current.id),cap=rr*cc;if(cont.length>cap)return msg(`Cannot save ${rr} × ${cc}. There are ${cont.length} direct contents but only ${cap} positions.`,'err');const bad=occupancyIssues(current.id,rr,cc);if(bad.length&&!repack)return msg(`${bad.length} current record(s) would become invalid. Use SAVE + REPACK CONTENTS or choose larger dimensions.`,'err');if(!confirm(repack?`Change to ${rr} × ${cc} and repack ${cont.length} direct contents into valid positions?`:`Change this location to ${rr} × ${cc}?`))return;
const actions=[['UpdateRecord',tableId,Number(current.id),{Rows:rr,Columns:cc}]];
if(repack){const sorted=[...cont].sort((a,b)=>(Number.isInteger(a.pos)?a.pos:1e9)-(Number.isInteger(b.pos)?b.pos:1e9)||a.name.localeCompare(b.name));sorted.forEach((o,i)=>actions.push(['UpdateRecord',o.kind==='Location'?tableId:INV,Number(o.id),{Position:i+1}]))}
await grist.docApi.applyUserActions(actions);await event({Location:Number(current.id),EventType:'Location Dimensions Changed',Notes:`Changed ${current.LocationID||current.Name} dimensions from ${current.Rows||'?'} x ${current.Columns||'?'} to ${rr} x ${cc}${repack?' and repacked direct contents':''}`});msg(`Dimensions saved${repack?' and contents repacked':''}.`,'ok');await ensure();const fresh=allRows.find(x=>Number(x.id)===Number(current.id));render(fresh)}catch(e){msg('Could not update dimensions: '+(e.message||e),'err')}}
ensure().catch(()=>{});grist.onRecord(async r=>{try{await ensure();render(allRows.find(x=>Number(x.id)===Number(r?.id))||r)}catch(e){render(r)}});
</script></body></html>

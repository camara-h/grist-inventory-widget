<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;color:#252631}
.top,.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h2{margin:0 0 4px}.sub,.meta,.note{color:#6d7078;font-size:.82rem}
.controls{display:flex;gap:7px}.ctrl,.crumb{border:0;border-radius:8px;background:#eef1f4;padding:7px 10px;font-weight:650;cursor:pointer}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}.sep{color:#aaa}
.panel{border:1px solid #dfe1e6;border-radius:12px;padding:14px}.header{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #eceef1}.name{font-size:1.12rem;font-weight:750}
.grid{display:grid;gap:9px}.slot{min-height:95px;border:1px dashed #d5d8de;border-radius:10px;padding:4px;background:#fafbfc;position:relative}
.slot-num{position:absolute;top:5px;right:7px;font-size:.68rem;color:#a1a4ab}.tile{height:100%;min-height:85px;width:100%;box-sizing:border-box;border:1px solid #d8dbe1;border-radius:8px;background:#fff;padding:10px;cursor:pointer;text-align:left}.tile.pathmatch{background:#fff7d6;border-color:#e7c85a}.tile.exactmatch{background:#eaf8f2;border-color:#48a77b;box-shadow:0 0 0 2px rgba(72,167,123,.12)}
.type{font-size:.68rem;text-transform:uppercase;color:#7a7e87}.tname{font-weight:700}.tid{font-family:monospace;font-size:.73rem;color:#7a7e87}.count{font-size:.72rem;color:#666b74;margin-top:6px}
.status{display:none;padding:9px;border-radius:8px;margin-top:10px}.ok{display:block;background:#eaf8f2;color:#136846}.err{display:block;background:#fdeeee;color:#962828}
@media(max-width:650px){.top,.header{flex-direction:column}}
</style></head>
<body>
<div class="top"><div><h2>Location Map</h2><div class="sub">Click to navigate. Search highlights every branch that leads to a match. Drag locations between slots to move or swap.</div></div><div class="controls"><button id="rootBtn" class="ctrl">ROOT</button><button id="upBtn" class="ctrl">UP ONE LEVEL</button></div></div>
<div style="display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap">
  <input id="search" placeholder="Search location name, ID, description..." style="flex:1;min-width:260px;padding:9px 10px;border:1px solid #cfd3da;border-radius:8px">
  <button id="clearSearch" class="ctrl">CLEAR SEARCH</button>
  <span id="searchCount" class="sub"></span>
</div>
<div id="crumbs" class="crumbs"></div>
<div class="panel"><div id="header"></div><div id="grid" class="grid"></div><div id="status" class="status"></div><div class="note">Uses parent Rows/Columns when defined. Otherwise uses 7 columns and grows rows automatically.</div></div>

<script>
const CAND=['Location_Inventory','LocationInventory','Locations'];
let tableId=null,rows=[],byId=new Map(),currentId=null,searchQuery='',matchIds=new Set();
grist.ready({requiredAccess:'full',allowSelectBy:true});

function refNum(v){if(typeof v==='number')return v;if(Array.isArray(v)&&v[0]==='R')return Number(v[1]);const n=Number(v);return Number.isFinite(n)&&n>0?n:null}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function findTable(){const ts=await grist.docApi.listTables();for(const c of CAND)if(ts.includes(c))return c;for(const id of ts){try{const t=await grist.docApi.fetchTable(id),s=new Set(Object.keys(t));if(s.has('ParentLocationID')&&s.has('LocationID')&&s.has('Type'))return id}catch(e){}}return null}
function label(r){return String(r?.Name||'').trim()||String(r?.LocationID||'').trim()||`Row ${r?.id}`}
function kids(id){return rows.filter(r=>id==null?(!r.parentId||!byId.has(Number(r.parentId))):Number(r.parentId)===Number(id))}
function ancestors(id){const a=[];let r=id==null?null:byId.get(Number(id)),seen=new Set();while(r&&!seen.has(r.id)){seen.add(r.id);a.push(r);r=r.parentId?byId.get(Number(r.parentId)):null}return a.reverse()}
function childCount(id){return kids(id).length}
function show(m,t='ok'){const e=document.getElementById('status');e.className='status '+t;e.textContent=m}

async function syncSelection(id){
  if(id==null)return;
  await Promise.allSettled([grist.setCursorPos({rowId:Number(id)}),grist.setSelectedRows([Number(id)])]);
}

async function load(){
  tableId=await findTable();if(!tableId)throw new Error('Location table not found');
  const t=await grist.docApi.fetchTable(tableId);
  rows=t.id.map((id,i)=>{const r={id};for(const [k,col] of Object.entries(t))if(k!=='id'&&Array.isArray(col))r[k]=col[i];r.parentId=refNum(r.ParentLocationID);return r});
  byId=new Map(rows.map(r=>[Number(r.id),r]));computeMatches();render();
}

function gridSpec(){
  if(currentId==null){const n=kids(null).length;return {cols:7,slots:Math.max(7,Math.ceil(Math.max(1,n)/7)*7)}}
  const p=byId.get(Number(currentId)),rr=Number(p?.Rows),cc=Number(p?.Columns);
  if(Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0)return {cols:cc,slots:rr*cc};
  const ks=kids(currentId),maxp=Math.max(0,...ks.map(k=>Number(k.Position)||0)),need=Math.max(ks.length,maxp,1);
  return {cols:7,slots:Math.max(7,Math.ceil(need/7)*7)};
}

function assignments(ks,slots){
  const used=new Set(),m=new Map();
  for(const r of ks){const p=Number(r.Position);if(Number.isInteger(p)&&p>=1&&p<=slots&&!used.has(p)){m.set(r.id,p);used.add(p)}}
  for(const r of ks){if(m.has(r.id))continue;let p=1;while(used.has(p))p++;m.set(r.id,p);used.add(p)}
  return m;
}


function searchableText(r){
  return [
    r.LocationID,
    r.Name,
    r.Description,
    r.Type
  ].filter(Boolean).join(' ').toLowerCase();
}

function computeMatches(){
  matchIds=new Set();
  const q=String(searchQuery||'').trim().toLowerCase();
  if(!q){
    document.getElementById('searchCount').textContent='';
    return;
  }
  for(const r of rows){
    if(searchableText(r).includes(q))matchIds.add(Number(r.id));
  }
  document.getElementById('searchCount').textContent=
    `${matchIds.size} match${matchIds.size===1?'':'es'}`;
}

function descendantMatchCount(id){
  let count=0;
  const stack=[Number(id)];
  const seen=new Set();
  while(stack.length){
    const cur=stack.pop();
    if(seen.has(cur))continue;
    seen.add(cur);
    if(matchIds.has(cur))count++;
    for(const c of rows){
      if(Number(c.parentId)===cur)stack.push(Number(c.id));
    }
  }
  return count;
}

function childLeadsToMatch(childId){
  return descendantMatchCount(Number(childId))>0;
}

function jumpToFirstMatch(){
  if(!matchIds.size)return;
  const first=rows.find(r=>matchIds.has(Number(r.id)));
  if(!first)return;
  currentId=Number(first.id);
  render();
  syncSelection(currentId);
}
function renderCrumbs(){
  const e=document.getElementById('crumbs'),chain=ancestors(currentId);
  e.innerHTML='<button class="crumb" data-root="1">Root</button>'+chain.map(r=>`<span class="sep">›</span><button class="crumb" data-id="${r.id}">${esc(label(r))}</button>`).join('');
  e.querySelector('[data-root]').onclick=()=>{currentId=null;render()};
  e.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{currentId=Number(b.dataset.id);render();await syncSelection(currentId)});
}
function renderHeader(){
  const e=document.getElementById('header');
  if(currentId==null){e.innerHTML='<div class="header"><div><div class="name">Top-level locations</div><div class="meta">Click a real location to make it the active selection.</div></div></div>';return}
  const r=byId.get(Number(currentId));e.innerHTML=`<div class="header"><div><div class="name">${esc(label(r))}</div><div class="meta">${esc(r.Type||'Location')} · ${esc(r.LocationID||'')}<br>${esc(r.Description||'')}</div></div><div class="meta">${childCount(r.id)} children</div></div>`;
}
function renderGrid(){
  const g=document.getElementById('grid'),ks=kids(currentId),spec=gridSpec(),pos=assignments(ks,spec.slots),occ=new Map([...pos.entries()].map(([id,p])=>[p,byId.get(Number(id))]));
  g.style.gridTemplateColumns=`repeat(${spec.cols},minmax(0,1fr))`;g.innerHTML='';
  for(let p=1;p<=spec.slots;p++){
    const r=occ.get(p),slot=document.createElement('div');slot.className='slot';slot.dataset.pos=p;slot.innerHTML=`<span class="slot-num">${p}</span>`;
    if(r){
      const t=document.createElement('button');
      const isExact=matchIds.has(Number(r.id));
      const leads=childLeadsToMatch(r.id);
      t.className='tile'+(isExact?' exactmatch':(leads?' pathmatch':''));
      t.draggable=true;
      const mcount=leads?descendantMatchCount(r.id):0;
      t.innerHTML=`<div class="type">${esc(r.Type||'Location')}</div><div class="tname">${esc(label(r))}</div><div class="tid">${esc(r.LocationID||'')}</div><div class="count">${childCount(r.id)} children${mcount?` · ${mcount} match${mcount===1?'':'es'} below`:''}</div>`;
      t.onclick=async()=>{currentId=Number(r.id);render();await syncSelection(currentId)};
      t.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({id:r.id,from:p}));
      slot.appendChild(t);
    }
    slot.ondragover=e=>e.preventDefault();
    slot.ondrop=async e=>{e.preventDefault();const d=JSON.parse(e.dataTransfer.getData('text/plain'));await moveOrSwap(Number(d.id),Number(d.from),p,occ.get(p))};
    g.appendChild(slot);
  }
}
async function moveOrSwap(id,from,to,target){
  if(from===to)return;const r=byId.get(id);if(!r)return;
  try{
    if(target){
      await grist.docApi.applyUserActions([['UpdateRecord',tableId,r.id,{Position:to}],['UpdateRecord',tableId,target.id,{Position:from}]]);
      show(`Swapped ${label(r)} with ${label(target)}.`,'ok');
    }else{
      await grist.getTable(tableId).update({id:r.id,fields:{Position:to}});
      show(`Moved ${label(r)} to position ${to}.`,'ok');
    }
    await load();currentId=r.parentId||currentId;render();await syncSelection(r.id);
  }catch(e){show('Move failed: '+(e.message||e),'err')}
}
function render(){renderCrumbs();renderHeader();renderGrid();document.getElementById('upBtn').disabled=currentId==null}
document.getElementById('rootBtn').onclick=()=>{currentId=null;render()};
document.getElementById('upBtn').onclick=async()=>{if(currentId==null)return;const r=byId.get(Number(currentId));currentId=r?.parentId||null;render();if(currentId!=null)await syncSelection(currentId)};
document.getElementById('search').oninput=e=>{searchQuery=e.target.value;computeMatches();render()};
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter'&&matchIds.size)jumpToFirstMatch()};
document.getElementById('clearSearch').onclick=()=>{document.getElementById('search').value='';searchQuery='';computeMatches();render()};
(async()=>{try{await load()}catch(e){show('Location map error: '+(e.message||e),'err')}})();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Location Visual Mapper</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#252631;background:#fff;
}
body{margin:0;padding:16px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
h2{font-size:1.2rem;margin:0 0 4px}
.sub{color:#6c6f78;font-size:.85rem}
.breadcrumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 14px}
.crumb{
  border:0;background:#eef1f4;color:#343740;border-radius:999px;
  padding:6px 9px;cursor:pointer;font-size:.82rem
}
.sep{color:#a1a4ab}
.panel{
  border:1px solid #dfe1e6;border-radius:12px;padding:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)
}
.current{
  display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding-bottom:12px;border-bottom:1px solid #eceef1;margin-bottom:14px
}
.current-name{font-size:1.15rem;font-weight:750}
.current-meta{color:#6d7078;font-size:.83rem;margin-top:3px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.tile{
  border:1px solid #d9dce2;border-radius:10px;background:#fff;
  padding:12px;text-align:left;cursor:pointer;min-height:92px;
  transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.tile:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.07);border-color:#aeb3bc}
.tile-type{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#777b84;margin-bottom:5px}
.tile-name{font-weight:700;line-height:1.2;margin-bottom:5px}
.tile-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;color:#777b84}
.tile-count{font-size:.75rem;color:#555a64;margin-top:8px}
.empty{padding:24px;text-align:center;color:#777b84}
.controls{display:flex;gap:7px;flex-wrap:wrap}
button.ctrl{
  border:0;border-radius:8px;padding:7px 9px;background:#eef1f4;color:#343740;
  font-weight:650;cursor:pointer;font-size:.8rem
}
button.ctrl:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:10px;padding:9px 10px;border-radius:8px;display:none;font-size:.85rem}
.err{display:block;background:#fdeeee;color:#962828}
.small{font-size:.76rem;color:#858991;margin-top:10px}
@media(max-width:650px){
  .topbar,.current{flex-direction:column}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h2>Location Map</h2>
    <div class="sub">Click through the hierarchy. Rooms → Freezers/Fridges → Shelves → Racks/Boxes.</div>
  </div>
  <div class="controls">
    <button class="ctrl" id="rootBtn">ROOT</button>
    <button class="ctrl" id="upBtn">UP ONE LEVEL</button>
  </div>
</div>

<div id="breadcrumbs" class="breadcrumbs"></div>

<div class="panel">
  <div id="currentHeader"></div>
  <div id="grid" class="grid"></div>
  <div id="status" class="status"></div>
  <div class="small">If a numeric Position column exists, children are ordered by it. Otherwise they are ordered by Type, Name, then LocationID.</div>
</div>

<script>
const LOCATION_CANDIDATES=['Location_Inventory','LocationInventory','Locations'];

let tableId=null;
let rows=[];
let byId=new Map();
let currentId=null;
let selectedFromGrist=null;

grist.ready({requiredAccess:'read table'});

function normName(v){
  return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');
}
function refNum(v){
  if(typeof v==='number') return v;
  if(Array.isArray(v)&&v[0]==='R') return Number(v[1]);
  const n=Number(v);
  return Number.isFinite(n)&&n>0?n:null;
}
function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;');
}
async function findTable(){
  const tables=await grist.docApi.listTables();

  for(const c of LOCATION_CANDIDATES){
    if(tables.includes(c)) return c;
  }

  const wanted=LOCATION_CANDIDATES.map(normName);
  for(const id of tables){
    const n=normName(id);
    if(wanted.some(w=>n===w||n.startsWith(w)||w.startsWith(n))) return id;
  }

  for(const id of tables){
    try{
      const t=await grist.docApi.fetchTable(id);
      const cols=new Set(Object.keys(t));
      if(cols.has('ParentLocationID')&&cols.has('Type')&&cols.has('LocationID')) return id;
    }catch(e){}
  }
  return null;
}

function displayName(r){
  return String(r.Name||'').trim() || String(r.LocationID||'').trim() || `Row ${r.id}`;
}

function childCount(id){
  return rows.filter(r=>Number(r.parentId)===Number(id)).length;
}

function childrenOf(id){
  let out;
  if(id==null){
    out=rows.filter(r=>!r.parentId || !byId.has(Number(r.parentId)));
  }else{
    out=rows.filter(r=>Number(r.parentId)===Number(id));
  }

  out.sort((a,b)=>{
    const ap=Number(a.Position), bp=Number(b.Position);
    const aHas=Number.isFinite(ap) && String(a.Position).trim()!=='';
    const bHas=Number.isFinite(bp) && String(b.Position).trim()!=='';
    if(aHas&&bHas&&ap!==bp) return ap-bp;
    if(aHas&&!bHas) return -1;
    if(!aHas&&bHas) return 1;

    const at=String(a.Type||''), bt=String(b.Type||'');
    if(at!==bt) return at.localeCompare(bt);
    const an=displayName(a), bn=displayName(b);
    if(an!==bn) return an.localeCompare(bn);
    return String(a.LocationID||'').localeCompare(String(b.LocationID||''));
  });
  return out;
}

function ancestors(id){
  const chain=[];
  let cur=id==null?null:byId.get(Number(id));
  const seen=new Set();
  while(cur && !seen.has(cur.id)){
    seen.add(cur.id);
    chain.push(cur);
    cur=cur.parentId?byId.get(Number(cur.parentId)):null;
  }
  return chain.reverse();
}

function renderBreadcrumbs(){
  const el=document.getElementById('breadcrumbs');
  const chain=ancestors(currentId);
  let html=`<button class="crumb" data-id="root">Root</button>`;
  for(const r of chain){
    html+=`<span class="sep">›</span><button class="crumb" data-id="${r.id}">${esc(displayName(r))}</button>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('.crumb').forEach(btn=>{
    btn.onclick=()=>{
      currentId=btn.dataset.id==='root'?null:Number(btn.dataset.id);
      render();
    };
  });
}

function renderHeader(){
  const el=document.getElementById('currentHeader');
  if(currentId==null){
    el.innerHTML=`<div class="current">
      <div><div class="current-name">Top-level locations</div><div class="current-meta">Rooms and any other root locations</div></div>
    </div>`;
    return;
  }

  const r=byId.get(Number(currentId));
  if(!r){
    el.innerHTML='';
    return;
  }

  el.innerHTML=`<div class="current">
    <div>
      <div class="current-name">${esc(displayName(r))}</div>
      <div class="current-meta">${esc(r.Type||'Location')} · ${esc(r.LocationID||'')} ${r.Description?`<br>${esc(r.Description)}`:''}</div>
    </div>
    <div class="current-meta">${childCount(r.id)} direct child${childCount(r.id)===1?'':'ren'}</div>
  </div>`;
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const kids=childrenOf(currentId);

  if(!kids.length){
    grid.innerHTML=`<div class="empty">No child locations here.</div>`;
    return;
  }

  grid.innerHTML=kids.map(r=>{
    const n=childCount(r.id);
    const pos=(r.Position!==undefined && String(r.Position).trim()!=='') ? `<div class="tile-count">Position ${esc(r.Position)}</div>` : '';
    return `<button class="tile" data-id="${r.id}">
      <div class="tile-type">${esc(r.Type||'Location')}</div>
      <div class="tile-name">${esc(displayName(r))}</div>
      <div class="tile-id">${esc(r.LocationID||'')}</div>
      ${pos}
      <div class="tile-count">${n} child${n===1?'':'ren'}</div>
    </button>`;
  }).join('');

  grid.querySelectorAll('.tile').forEach(tile=>{
    tile.onclick=()=>{
      currentId=Number(tile.dataset.id);
      render();
    };
  });
}

function render(){
  renderBreadcrumbs();
  renderHeader();
  renderGrid();
  document.getElementById('upBtn').disabled=currentId==null;
}

async function load(){
  tableId=await findTable();
  if(!tableId) throw new Error('Could not find the Location Inventory table.');

  const t=await grist.docApi.fetchTable(tableId);
  rows=t.id.map((id,i)=>{
    const r={id};
    for(const [k,col] of Object.entries(t)){
      if(k==='id'||!Array.isArray(col)) continue;
      r[k]=col[i];
    }
    r.parentId=refNum(r.ParentLocationID);
    return r;
  });

  byId=new Map(rows.map(r=>[Number(r.id),r]));

  if(selectedFromGrist && byId.has(Number(selectedFromGrist))){
    currentId=Number(selectedFromGrist);
  }else{
    currentId=null;
  }

  render();
}

document.getElementById('rootBtn').onclick=()=>{currentId=null;render()};
document.getElementById('upBtn').onclick=()=>{
  if(currentId==null)return;
  const r=byId.get(Number(currentId));
  currentId=r?.parentId || null;
  render();
};

grist.onRecord(record=>{
  if(record && record.id){
    selectedFromGrist=Number(record.id);
    if(byId.size && byId.has(selectedFromGrist)){
      currentId=selectedFromGrist;
      render();
    }
  }
});

(async()=>{
  try{await load()}
  catch(e){
    const s=document.getElementById('status');
    s.className='status err';
    s.textContent='Location map error: '+(e.message||e);
  }
})();
</script>
</body>
</html>

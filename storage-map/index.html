<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unified Storage Map v2</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252631}
body{margin:0;padding:16px;background:#fff}
.top,.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h2{margin:0 0 4px}.sub,.meta,.note{color:#6d7078;font-size:.82rem}
.controls{display:flex;gap:7px;flex-wrap:wrap}.ctrl,.crumb,.tab{border:0;border-radius:8px;background:#eef1f4;padding:7px 10px;font-weight:650;cursor:pointer}
.searchwrap{position:relative;margin:12px 0}.searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.searchbar input,.modal input,.modal select{box-sizing:border-box;padding:9px 10px;border:1px solid #cfd3da;border-radius:8px}
.searchbar input{flex:1;min-width:260px}
.results{position:absolute;z-index:20;left:0;right:110px;top:42px;background:white;border:1px solid #d9dce2;border-radius:10px;box-shadow:0 7px 22px rgba(0,0,0,.13);max-height:330px;overflow:auto;display:none}
.result{padding:9px 11px;border-bottom:1px solid #eee;cursor:pointer}.result:last-child{border-bottom:0}.result:hover,.result.sel{background:#f4f7f9}
.result .rtitle{font-weight:700}.result .rmeta{font-size:.76rem;color:#6d7078;margin-top:2px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}.sep{color:#aaa}.crumb.drop-target{outline:2px solid #16b378;background:#eaf8f2}
.panel{border:1px solid #dfe1e6;border-radius:12px;padding:14px}.header{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #eceef1}.name{font-size:1.12rem;font-weight:750}
.grid{display:grid;gap:9px}.slot{min-height:105px;border:1px dashed #d5d8de;border-radius:10px;padding:4px;background:#fafbfc;position:relative;cursor:pointer}
.slot:hover{background:#f3f7f5;border-color:#aebdb5}.slot-num{position:absolute;top:5px;right:7px;font-size:.68rem;color:#a1a4ab}
.emptyhint{display:flex;height:100%;min-height:95px;align-items:center;justify-content:center;color:#b0b4bb;font-size:.75rem;text-align:center}
.tile{height:100%;min-height:95px;width:100%;box-sizing:border-box;border:1px solid #d8dbe1;border-radius:8px;background:#fff;padding:10px;cursor:pointer;text-align:left}
.tile.location{border-left:4px solid #8b93a1}.tile.item{border-left:4px solid #16b378}
.tile.pathmatch{background:#fff7d6;border-color:#e7c85a}.tile.exactmatch{background:#eaf8f2;border-color:#48a77b;box-shadow:0 0 0 2px rgba(72,167,123,.12)}
.tile.invalid{background:#fdeeee;border-color:#cc6363}.type{font-size:.68rem;text-transform:uppercase;color:#7a7e87;margin-bottom:4px}.tname{font-weight:700}.tid{font-family:ui-monospace,monospace;font-size:.73rem;color:#7a7e87;margin-top:4px}.count{font-size:.72rem;color:#666b74;margin-top:6px}
.status{display:none;padding:9px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.ok{display:block;background:#eaf8f2;color:#136846}.err{display:block;background:#fdeeee;color:#962828}.warn{display:block;background:#fff6dc;color:#765600}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:#6d7078}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.locdot{background:#8b93a1}.itemdot{background:#16b378}.matchdot{background:#e7c85a}.invaliddot{background:#cc6363}
.backdrop{display:none;position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.32);align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:18px;box-shadow:0 15px 45px rgba(0,0,0,.22)}
.modal h3{margin:0 0 5px}.modalrow{display:flex;gap:8px;margin:12px 0}.modalrow input{flex:1}.tabs{display:flex;gap:6px;margin-top:12px}.tab.active{background:#16b378;color:white}
.picklist{border:1px solid #ddd;border-radius:9px;max-height:360px;overflow:auto}.pick{padding:10px;border-bottom:1px solid #eee;cursor:pointer}.pick:hover{background:#f4f7f9}.pick:last-child{border-bottom:0}.picktitle{font-weight:700}.pickmeta{font-size:.76rem;color:#6d7078;margin-top:2px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.actions button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.cancel{background:#eef1f4}.primary{background:#16b378;color:#fff}
@media(max-width:650px){.top,.header{flex-direction:column}.results{right:0}}
</style>
</head>
<body>
<div class="top">
  <div><h2>Storage Map</h2><div class="sub">Locations + active inventory in one hierarchy.</div></div>
  <div class="controls"><button id="rootBtn" class="ctrl">ROOT</button><button id="upBtn" class="ctrl">UP ONE LEVEL</button><button id="refreshBtn" class="ctrl">REFRESH</button></div>
</div>

<div class="searchwrap">
  <div class="searchbar"><input id="search" autocomplete="off" placeholder="Search locations, ItemID, name, catalogue, lot, metadata..."><button id="clearSearch" class="ctrl">CLEAR</button><span id="searchCount" class="sub"></span></div>
  <div id="searchResults" class="results"></div>
</div>

<div id="crumbs" class="crumbs"></div>
<div class="panel">
  <div id="header"></div>
  <div id="grid" class="grid"></div>
  <div id="status" class="status"></div>
  <div class="legend">
    <span><i class="dot locdot"></i>Location</span><span><i class="dot itemdot"></i>Active item</span>
    <span><i class="dot matchdot"></i>Branch to match</span><span><i class="dot invaliddot"></i>Invalid stored position</span>
  </div>
  <div class="note">Click an empty slot to place an existing item/location there. Dragging still works for quick moves and swaps.</div>
</div>

<div id="backdrop" class="backdrop">
  <div class="modal">
    <h3 id="modalTitle">Add Existing</h3>
    <div id="modalPath" class="meta"></div>
    <div class="tabs"><button id="itemTab" class="tab active">ADD EXISTING ITEM</button><button id="locTab" class="tab">ADD EXISTING LOCATION</button></div>
    <div class="modalrow"><input id="modalSearch" autocomplete="off" placeholder="Search any available metadata..."></div>
    <div id="pickList" class="picklist"></div>
    <div class="actions"><button id="modalCancel" class="cancel">CANCEL</button></div>
  </div>
</div>

<script>
const INV='Inventory', EVENTS='Events', LOC_CAND=['Location_Inventory','LocationInventory','Locations'];
let locTable=null, locRows=[], invRows=[], locById=new Map(), itemById=new Map(), currentId=null;
let q='', locMatches=new Set(), itemMatches=new Set(), searchHits=[], searchSel=0;
let subtypeTables=[], subtypeRowsByInventory=new Map(), eventCols=new Set();
let modalSlot=null, modalMode='item';

grist.ready({requiredAccess:'full',allowSelectBy:true});

const norm=v=>String(v??'').trim().toLowerCase();
function refNum(v){if(typeof v==='number')return v;if(Array.isArray(v)&&v[0]==='R')return Number(v[1]);const n=Number(v);return Number.isFinite(n)&&n>0?n:null}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function scalar(v){return typeof v==='string'||typeof v==='number'||typeof v==='boolean'}
async function findLocTable(){const ts=await grist.docApi.listTables();for(const c of LOC_CAND)if(ts.includes(c))return c;for(const id of ts){try{const t=await grist.docApi.fetchTable(id),s=new Set(Object.keys(t));if(s.has('ParentLocationID')&&s.has('LocationID')&&s.has('Type'))return id}catch(e){}}return null}
function rowify(t){return t.id.map((id,i)=>{const r={id};for(const [k,c] of Object.entries(t))if(k!=='id'&&Array.isArray(c))r[k]=c[i];return r})}
function locLabel(r){return String(r?.Name||'').trim()||String(r?.LocationID||'').trim()||`Location ${r?.id}`}
function itemLabel(r){return String(r?.ItemName||'').trim()||String(r?.ItemID||'').trim()||`Item ${r?.id}`}
function locKids(id){return locRows.filter(r=>id==null?(!r.parentId||!locById.has(Number(r.parentId))):Number(r.parentId)===Number(id))}
function activeItems(id){return invRows.filter(r=>norm(r.Status)==='active'&&Number(r.locationRef)===Number(id))}
function ancestors(id){const a=[];let r=id==null?null:locById.get(Number(id)),seen=new Set();while(r&&!seen.has(r.id)){seen.add(r.id);a.push(r);r=r.parentId?locById.get(Number(r.parentId)):null}return a.reverse()}
function pathFor(id){return ancestors(id).map(locLabel).join(' › ')}
function show(m,t='ok'){const e=document.getElementById('status');e.className='status '+t;e.textContent=m}
async function syncLoc(id){if(id==null)return;await Promise.allSettled([grist.setCursorPos({rowId:Number(id)}),grist.setSelectedRows([Number(id)])])}

function getLinkRef(row, tableRows){
  for(const k of ['Item','ItemID','ItemName','Inventory','InventoryItem']){
    if(k in row){
      const n=refNum(row[k]);
      if(n && itemById.has(n)) return n;
    }
  }
  return null;
}
async function loadSubtypeSearchData(){
  subtypeRowsByInventory=new Map(); subtypeTables=[];
  const tables=await grist.docApi.listTables();
  const ignore=new Set([INV,EVENTS,locTable,'Controlled_Lists','ItemTypes','MetadataFields','Settings']);
  for(const tid of tables){
    if(ignore.has(tid))continue;
    try{
      const t=await grist.docApi.fetchTable(tid), rows=rowify(t);
      let linked=0;
      for(const r of rows){
        const ref=getLinkRef(r,rows);
        if(ref){
          linked++;
          const arr=subtypeRowsByInventory.get(ref)||[];
          arr.push({table:tid,row:r}); subtypeRowsByInventory.set(ref,arr);
        }
      }
      if(linked)subtypeTables.push(tid);
    }catch(e){}
  }
}
function itemText(r){
  const vals=[];
  for(const [k,v] of Object.entries(r))if(k!=='id'&&k!=='locationRef'&&scalar(v)&&v!==''&&v!=null)vals.push(`${k}:${v}`);
  for(const x of subtypeRowsByInventory.get(Number(r.id))||[]){
    for(const [k,v] of Object.entries(x.row))if(k!=='id'&&scalar(v)&&v!==''&&v!=null)vals.push(`${k}:${v}`);
  }
  const l=locById.get(Number(r.locationRef)); if(l) vals.push(`location:${l.LocationID||''} ${l.Name||''} ${l.Description||''}`);
  return vals.join(' ').toLowerCase();
}
function locText(r){return Object.entries(r).filter(([k,v])=>k!=='id'&&k!=='parentId'&&scalar(v)&&v!==''&&v!=null).map(([k,v])=>`${k}:${v}`).join(' ').toLowerCase()}

function computeMatches(){
  locMatches=new Set(); itemMatches=new Set(); searchHits=[];
  const s=norm(q);
  if(!s){document.getElementById('searchCount').textContent='';renderSearchResults();return}
  for(const r of locRows)if(locText(r).includes(s)){locMatches.add(Number(r.id));searchHits.push({kind:'location',id:r.id,title:locLabel(r),meta:`${r.Type||'Location'} · ${r.LocationID||''} · ${r.Description||pathFor(r.id)}`})}
  for(const r of invRows)if(norm(r.Status)==='active'&&itemText(r).includes(s)){itemMatches.add(Number(r.id));const l=locById.get(Number(r.locationRef));searchHits.push({kind:'item',id:r.id,title:itemLabel(r),meta:`${r.ItemType||'Item'} · ${r.ItemID||''} · ${l?.Description||pathFor(r.locationRef)||'Unassigned'}`})}
  searchHits.sort((a,b)=>{const ae=norm(a.title)===s?0:1,be=norm(b.title)===s?0:1;return ae-be||a.title.localeCompare(b.title)});
  searchSel=0; document.getElementById('searchCount').textContent=`${searchHits.length} match${searchHits.length===1?'':'es'}`;renderSearchResults();
}
function renderSearchResults(){
  const e=document.getElementById('searchResults');
  if(!q||!searchHits.length){e.style.display='none';e.innerHTML='';return}
  e.innerHTML=searchHits.slice(0,100).map((h,i)=>`<div class="result ${i===searchSel?'sel':''}" data-i="${i}"><div class="rtitle">${esc(h.title)}</div><div class="rmeta">${esc(h.kind==='item'?'ITEM':'LOCATION')} · ${esc(h.meta)}</div></div>`).join('');
  e.style.display='block';
  e.querySelectorAll('.result').forEach(x=>x.onclick=()=>openHit(searchHits[Number(x.dataset.i)]));
}
function openHit(h){
  document.getElementById('searchResults').style.display='none';
  if(h.kind==='location'){currentId=Number(h.id);render();syncLoc(currentId)}
  else{const r=itemById.get(Number(h.id));if(r?.locationRef){currentId=Number(r.locationRef);render();syncLoc(currentId)}}
}
function branchCount(id){let c=0,stack=[Number(id)],seen=new Set();while(stack.length){const cur=stack.pop();if(seen.has(cur))continue;seen.add(cur);if(locMatches.has(cur))c++;c+=invRows.filter(r=>norm(r.Status)==='active'&&Number(r.locationRef)===cur&&itemMatches.has(Number(r.id))).length;for(const k of locRows)if(Number(k.parentId)===cur)stack.push(Number(k.id))}return c}

async function load(){
  locTable=await findLocTable();if(!locTable)throw new Error('Location Inventory table not found');
  const [lt,it]=await Promise.all([grist.docApi.fetchTable(locTable),grist.docApi.fetchTable(INV)]);
  locRows=rowify(lt);invRows=rowify(it);
  for(const r of locRows)r.parentId=refNum(r.ParentLocationID);
  for(const r of invRows)r.locationRef=refNum(r.LocationID);
  locById=new Map(locRows.map(r=>[Number(r.id),r]));itemById=new Map(invRows.map(r=>[Number(r.id),r]));
  try{eventCols=new Set(Object.keys(await grist.docApi.fetchTable(EVENTS)))}catch(e){eventCols=new Set()}
  await loadSubtypeSearchData();computeMatches();render();
  const bad=invalidObjectsAt(currentId);
  if(bad.length)show(`${bad.length} record(s) in this location have invalid or colliding Position values. They are shown in red.`, 'warn');
}
function capacity(id){if(id==null)return null;const p=locById.get(Number(id)),rr=Number(p?.Rows),cc=Number(p?.Columns);return Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0?rr*cc:null}
function spec(){if(currentId==null){const n=locKids(null).length;return {cols:7,slots:Math.max(7,Math.ceil(Math.max(1,n)/7)*7)}}const p=locById.get(Number(currentId)),rr=Number(p?.Rows),cc=Number(p?.Columns);if(Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0)return {cols:cc,slots:rr*cc};const os=[...locKids(currentId),...activeItems(currentId)],maxp=Math.max(0,...os.map(o=>Number(o.Position)||0)),need=Math.max(os.length,maxp,1);return {cols:7,slots:Math.max(7,Math.ceil(need/7)*7)}}
function objs(){if(currentId==null)return locKids(null).map(r=>({kind:'location',id:r.id,position:r.Position,data:r}));return [...locKids(currentId).map(r=>({kind:'location',id:r.id,position:r.Position,data:r})),...activeItems(currentId).map(r=>({kind:'item',id:r.id,position:r.Position,data:r}))]}
function invalidObjectsAt(id){
  const os=id==null?locKids(null).map(r=>({kind:'location',id:r.id,position:r.Position,data:r})):[...locKids(id).map(r=>({kind:'location',id:r.id,position:r.Position,data:r})),...activeItems(id).map(r=>({kind:'item',id:r.id,position:r.Position,data:r}))];
  const cap=capacity(id),seen=new Map(),bad=[];
  for(const o of os){const p=Number(o.position);if(!Number.isInteger(p)||p<1||(cap&&p>cap)){bad.push(o);continue}if(seen.has(p)){bad.push(o);bad.push(seen.get(p))}else seen.set(p,o)}
  return [...new Map(bad.map(x=>[`${x.kind}:${x.id}`,x])).values()];
}
function assign(objects,slots){const used=new Set(),m=new Map();for(const o of objects){const p=Number(o.position);if(Number.isInteger(p)&&p>=1&&p<=slots&&!used.has(p)){m.set(`${o.kind}:${o.id}`,p);used.add(p)}}for(const o of objects){const k=`${o.kind}:${o.id}`;if(m.has(k))continue;let p=1;while(used.has(p))p++;m.set(k,p);used.add(p)}return m}
function occupied(targetId,exclude=null){const m=new Map();for(const r of locKids(targetId)){if(exclude==='location:'+r.id)continue;const p=Number(r.Position);if(Number.isInteger(p)&&p>0)m.set(p,{kind:'location',r})}for(const r of activeItems(targetId)){if(exclude==='item:'+r.id)continue;const p=Number(r.Position);if(Number.isInteger(p)&&p>0)m.set(p,{kind:'item',r})}return m}

function renderCrumbs(){const e=document.getElementById('crumbs'),chain=ancestors(currentId);e.innerHTML='<button class="crumb" data-root="1">Root</button>'+chain.map(r=>`<span class="sep">›</span><button class="crumb" data-id="${r.id}">${esc(locLabel(r))}</button>`).join('');e.querySelector('[data-root]').onclick=()=>{currentId=null;render()};e.querySelectorAll('[data-id]').forEach(b=>{const id=Number(b.dataset.id);b.onclick=async()=>{currentId=id;render();await syncLoc(id)};b.ondragover=e=>{e.preventDefault();b.classList.add('drop-target')};b.ondragleave=()=>b.classList.remove('drop-target');b.ondrop=async e=>{e.preventDefault();b.classList.remove('drop-target');const d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind==='item')await relocateItem(Number(d.id),id,null)}})}
function renderHeader(){const e=document.getElementById('header');if(currentId==null){e.innerHTML='<div class="header"><div><div class="name">Top-level locations</div><div class="meta">Search results are listed under the search field. Click a result to navigate directly.</div></div></div>';return}const r=locById.get(Number(currentId)),bad=invalidObjectsAt(currentId);e.innerHTML=`<div class="header"><div><div class="name">${esc(locLabel(r))}</div><div class="meta">${esc(r.Type||'Location')} · ${esc(r.LocationID||'')}<br>${esc(r.Description||'')}</div></div><div class="meta">${locKids(r.id).length} child locations · ${activeItems(r.id).length} active items${bad.length?` · <b>${bad.length} invalid positions</b>`:''}</div></div>`}
function tileHtml(o){if(o.kind==='location'){const r=o.data,b=branchCount(r.id);return `<div class="type">${esc(r.Type||'Location')}</div><div class="tname">${esc(locLabel(r))}</div><div class="tid">${esc(r.LocationID||'')}</div><div class="count">${locKids(r.id).length} locations · ${activeItems(r.id).length} items${b?` · ${b} matches below`:''}</div>`}const r=o.data;return `<div class="type">${esc(r.ItemType||'Inventory Item')}</div><div class="tname">${esc(itemLabel(r))}</div><div class="tid">${esc(r.ItemID||'')}</div><div class="count">${esc(r.Status||'')}</div>`}

function renderGrid(){
  const g=document.getElementById('grid'),objects=objs(),sp=spec(),pos=assign(objects,sp.slots),occ=new Map(),invalid=new Set(invalidObjectsAt(currentId).map(o=>`${o.kind}:${o.id}`));
  for(const o of objects)occ.set(pos.get(`${o.kind}:${o.id}`),o);g.style.gridTemplateColumns=`repeat(${sp.cols},minmax(0,1fr))`;g.innerHTML='';
  for(let p=1;p<=sp.slots;p++){
    const o=occ.get(p),slot=document.createElement('div');slot.className='slot';slot.dataset.pos=p;slot.innerHTML=`<span class="slot-num">${p}</span>`;
    if(o){
      const t=document.createElement('button'),key=`${o.kind}:${o.id}`,exact=o.kind==='location'?locMatches.has(Number(o.id)):itemMatches.has(Number(o.id)),path=o.kind==='location'&&branchCount(o.id)>0;
      t.className=`tile ${o.kind}`+(exact?' exactmatch':(!exact&&path?' pathmatch':''))+(invalid.has(key)?' invalid':'');t.draggable=true;t.innerHTML=tileHtml(o);
      if(o.kind==='location'){t.onclick=async()=>{currentId=Number(o.id);render();await syncLoc(currentId)};t.ondragover=e=>{e.preventDefault();e.stopPropagation()};t.ondrop=async e=>{e.preventDefault();e.stopPropagation();const d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind==='item')await relocateItem(Number(d.id),Number(o.id),null)}}
      t.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({kind:o.kind,id:o.id,from:p,parent:currentId}));slot.appendChild(t);
    } else {
      const h=document.createElement('div');h.className='emptyhint';h.textContent='+ Add existing';slot.appendChild(h);slot.onclick=()=>openAddExisting(p);
    }
    slot.ondragover=e=>e.preventDefault();slot.ondrop=async e=>{e.preventDefault();e.stopPropagation();const d=JSON.parse(e.dataTransfer.getData('text/plain')),target=occ.get(p);if(target)await swap(d,target,p);else await moveEmpty(d,p)};
    g.appendChild(slot);
  }
}

function existingEventFields(fields){const o={};for(const [k,v] of Object.entries(fields))if(eventCols.has(k)&&v!==undefined&&v!==null)o[k]=v;return o}
async function logEvent(fields){if(!eventCols.size)return;const f=existingEventFields(fields);if(Object.keys(f).length)await grist.getTable(EVENTS).create({fields:f})}
async function moveEmpty(d,to){if(currentId==null&&d.kind==='item')return;const cap=capacity(currentId);if(cap&&to>cap)return show(`Position ${to} exceeds capacity ${cap}.`,'err');try{if(d.kind==='location')await relocateLocation(Number(d.id),currentId,to,false);else await relocateItem(Number(d.id),currentId,to,false);await load()}catch(e){show('Move failed: '+(e.message||e),'err')}}
async function swap(d,target,to){if(d.kind==='item'&&target.kind==='location')return relocateItem(Number(d.id),Number(target.id),null);if(Number(d.from)===Number(to))return;try{await grist.docApi.applyUserActions([['UpdateRecord',d.kind==='location'?locTable:INV,Number(d.id),{Position:Number(to)}],['UpdateRecord',target.kind==='location'?locTable:INV,Number(target.id),{Position:Number(d.from)}]]);if(d.kind==='item')await logEvent({Item:Number(d.id),EventType:'Relocated',Notes:`Position changed from ${d.from} to ${to} within ${locById.get(currentId)?.Description||locLabel(locById.get(currentId))}`});if(target.kind==='item')await logEvent({Item:Number(target.id),EventType:'Relocated',Notes:`Position changed from ${to} to ${d.from} within ${locById.get(currentId)?.Description||locLabel(locById.get(currentId))}`});show('Positions swapped.','ok');await load()}catch(e){show('Swap failed: '+(e.message||e),'err')}}
async function relocateItem(itemId,targetId,pos=null,ask=true){
  const item=itemById.get(itemId),target=locById.get(Number(targetId));if(!item||!target)return;
  const oldLoc=locById.get(Number(item.locationRef)),oldPos=item.Position,occ=occupied(targetId,`item:${itemId}`),cap=capacity(targetId);
  if(pos==null){pos=1;while(occ.has(pos))pos++}
  if(cap&&pos>cap)return show(`${locLabel(target)} has no free position at ${pos}. Capacity is ${cap}.`,'err');
  if(occ.has(pos))return show(`Position ${pos} is already occupied.`,'err');
  if(ask&&!confirm(`Move ${itemLabel(item)} to:\n\n${target.Description||locLabel(target)}\nPosition ${pos}?`))return;
  await grist.getTable(INV).update({id:itemId,fields:{LocationID:targetId,Position:pos}});
  await logEvent({Item:itemId,EventType:'Relocated',Notes:`Relocated from ${oldLoc?.Description||oldLoc?.LocationID||'Unknown'} position ${oldPos||'blank'} to ${target.Description||target.LocationID} position ${pos}`});
  show(`Moved ${itemLabel(item)} to ${locLabel(target)}, position ${pos}.`,'ok');
}
function isDescendant(candidateParent,movingId){let r=locById.get(Number(candidateParent)),seen=new Set();while(r&&!seen.has(r.id)){if(Number(r.id)===Number(movingId))return true;seen.add(r.id);r=r.parentId?locById.get(Number(r.parentId)):null}return false}
async function relocateLocation(id,targetId,pos,ask=true){
  const r=locById.get(id);if(!r)return;if(String(r.Type||'')==='Room')return show('Rooms cannot be relocated under another location.','err');if(targetId==null)return show('Use a real parent location. Root relocation is not allowed for non-Room locations.','err');if(Number(id)===Number(targetId)||isDescendant(targetId,id))return show('That move would create a circular location hierarchy.','err');
  const target=locById.get(Number(targetId)),old=locById.get(Number(r.parentId)),oldPos=r.Position,occ=occupied(targetId,`location:${id}`),cap=capacity(targetId);
  if(cap&&pos>cap)return show(`Position ${pos} exceeds ${locLabel(target)} capacity ${cap}.`,'err');if(occ.has(pos))return show(`Position ${pos} is already occupied.`,'err');
  if(ask&&!confirm(`Relocate ${locLabel(r)} to:\n\n${target.Description||locLabel(target)}\nPosition ${pos}?`))return;
  await grist.getTable(locTable).update({id,fields:{ParentLocationID:targetId,Position:pos}});
  await logEvent({Location:id,EventType:'Location Relocated',Notes:`Location ${r.LocationID||locLabel(r)} moved from ${old?.Description||old?.LocationID||'Unknown'} position ${oldPos||'blank'} to ${target.Description||target.LocationID} position ${pos}`});
  show(`Relocated ${locLabel(r)} to ${locLabel(target)}, position ${pos}.`,'ok');
}

function openAddExisting(slot){
  if(currentId==null){modalMode='location';document.getElementById('itemTab').style.display='none'}else document.getElementById('itemTab').style.display='';
  modalSlot=slot;document.getElementById('backdrop').style.display='flex';document.getElementById('modalTitle').textContent=`Place existing record in position ${slot}`;
  document.getElementById('modalPath').textContent=currentId==null?'Root level':(locById.get(currentId)?.Description||pathFor(currentId));
  setModalMode(currentId==null?'location':'item');document.getElementById('modalSearch').value='';renderPickList();
}
function setModalMode(m){modalMode=m;document.getElementById('itemTab').classList.toggle('active',m==='item');document.getElementById('locTab').classList.toggle('active',m==='location');document.getElementById('modalSearch').placeholder=m==='item'?'Search ItemID, name, catalogue, lot, metadata...':'Search LocationID, name, type, description...';renderPickList()}
function renderPickList(){
  const s=norm(document.getElementById('modalSearch').value),e=document.getElementById('pickList');let rows=[];
  if(modalMode==='item'){
    rows=invRows.filter(r=>norm(r.Status)==='active'&&(!s||itemText(r).includes(s))).slice(0,100).map(r=>({id:r.id,title:itemLabel(r),meta:`${r.ItemType||'Item'} · ${r.ItemID||''} · ${locById.get(Number(r.locationRef))?.Description||'Unassigned'}`}));
  }else{
    rows=locRows.filter(r=>String(r.Type||'')!=='Room'&&Number(r.id)!==Number(currentId)&&!isDescendant(currentId,r.id)&&(!s||locText(r).includes(s))).slice(0,100).map(r=>({id:r.id,title:locLabel(r),meta:`${r.Type||'Location'} · ${r.LocationID||''} · ${r.Description||pathFor(r.id)}`}));
  }
  e.innerHTML=rows.length?rows.map(r=>`<div class="pick" data-id="${r.id}"><div class="picktitle">${esc(r.title)}</div><div class="pickmeta">${esc(r.meta)}</div></div>`).join(''):'<div class="pickmeta" style="padding:12px">No matches.</div>';
  e.querySelectorAll('.pick').forEach(x=>x.onclick=async()=>{const id=Number(x.dataset.id);try{if(modalMode==='item')await relocateItem(id,currentId,modalSlot,true);else await relocateLocation(id,currentId,modalSlot,true);closeModal();await load()}catch(err){show('Relocation failed: '+(err.message||err),'err')}});
}
function closeModal(){document.getElementById('backdrop').style.display='none'}

function render(){renderCrumbs();renderHeader();renderGrid();document.getElementById('upBtn').disabled=currentId==null}
document.getElementById('rootBtn').onclick=()=>{currentId=null;render()};
document.getElementById('upBtn').onclick=async()=>{if(currentId==null)return;const r=locById.get(currentId);currentId=r?.parentId||null;render();if(currentId!=null)await syncLoc(currentId)};
document.getElementById('refreshBtn').onclick=load;
document.getElementById('search').oninput=e=>{q=e.target.value;computeMatches();render()};
document.getElementById('search').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();searchSel=Math.min(searchSel+1,searchHits.length-1);renderSearchResults()}else if(e.key==='ArrowUp'){e.preventDefault();searchSel=Math.max(0,searchSel-1);renderSearchResults()}else if(e.key==='Enter'&&searchHits.length){e.preventDefault();openHit(searchHits[searchSel]||searchHits[0])}else if(e.key==='Escape')document.getElementById('searchResults').style.display='none'};
document.getElementById('clearSearch').onclick=()=>{document.getElementById('search').value='';q='';computeMatches();render()};
document.getElementById('itemTab').onclick=()=>setModalMode('item');document.getElementById('locTab').onclick=()=>setModalMode('location');document.getElementById('modalSearch').oninput=renderPickList;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};
(async()=>{try{await load()}catch(e){show('Storage map error: '+(e.message||e),'err')}})();
</script>

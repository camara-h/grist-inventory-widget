<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:16px;color:#252631}
.top,.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h2{margin:0 0 4px}.sub,.meta,.note{color:#6d7078;font-size:.82rem}
.controls{display:flex;gap:7px;flex-wrap:wrap}.ctrl,.crumb{border:0;border-radius:8px;background:#eef1f4;padding:7px 10px;font-weight:650;cursor:pointer}
.searchbar{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}.searchbar input{flex:1;min-width:260px;padding:9px 10px;border:1px solid #cfd3da;border-radius:8px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}.sep{color:#aaa}.crumb.drop-target{outline:2px solid #16b378;background:#eaf8f2}
.panel{border:1px solid #dfe1e6;border-radius:12px;padding:14px}.header{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #eceef1}.name{font-size:1.12rem;font-weight:750}
.grid{display:grid;gap:9px}.slot{min-height:105px;border:1px dashed #d5d8de;border-radius:10px;padding:4px;background:#fafbfc;position:relative}
.slot-num{position:absolute;top:5px;right:7px;font-size:.68rem;color:#a1a4ab}
.tile{height:100%;min-height:95px;width:100%;box-sizing:border-box;border:1px solid #d8dbe1;border-radius:8px;background:#fff;padding:10px;cursor:pointer;text-align:left}
.tile.location{border-left:4px solid #8b93a1}.tile.item{border-left:4px solid #16b378}
.tile.pathmatch{background:#fff7d6;border-color:#e7c85a}.tile.exactmatch{background:#eaf8f2;border-color:#48a77b;box-shadow:0 0 0 2px rgba(72,167,123,.12)}
.type{font-size:.68rem;text-transform:uppercase;color:#7a7e87;margin-bottom:4px}.tname{font-weight:700}.tid{font-family:monospace;font-size:.73rem;color:#7a7e87;margin-top:4px}.count{font-size:.72rem;color:#666b74;margin-top:6px}
.status{display:none;padding:9px;border-radius:8px;margin-top:10px;white-space:pre-wrap}.ok{display:block;background:#eaf8f2;color:#136846}.err{display:block;background:#fdeeee;color:#962828}.warn{display:block;background:#fff6dc;color:#765600}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:#6d7078}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.locdot{background:#8b93a1}.itemdot{background:#16b378}.matchdot{background:#e7c85a}
@media(max-width:650px){.top,.header{flex-direction:column}}
</style></head>
<body>
<div class="top"><div><h2>Storage Map</h2><div class="sub">Locations + active inventory in one hierarchy.</div></div><div class="controls"><button id="rootBtn" class="ctrl">ROOT</button><button id="upBtn" class="ctrl">UP ONE LEVEL</button><button id="refreshBtn" class="ctrl">REFRESH</button></div></div>
<div class="searchbar"><input id="search" placeholder="Search LocationID, box, ItemID, sample/reagent name, type..."><button id="clearSearch" class="ctrl">CLEAR SEARCH</button><span id="searchCount" class="sub"></span></div>
<div id="crumbs" class="crumbs"></div>
<div class="panel"><div id="header"></div><div id="grid" class="grid"></div><div id="status" class="status"></div>
<div class="legend"><span><i class="dot locdot"></i>Location</span><span><i class="dot itemdot"></i>Active item</span><span><i class="dot matchdot"></i>Branch to search match</span></div>
<div class="note">Drag to empty = move position. Drag onto another item = swap. Drag an inventory item onto a child location or breadcrumb to move it inside that location.</div></div>

<script>
const LOC_CAND=['Location_Inventory','LocationInventory','Locations'], INV='Inventory';
let locTable=null, locRows=[], invRows=[], locById=new Map(), itemById=new Map(), currentId=null, q='', locMatches=new Set(), itemMatches=new Set();

grist.ready({requiredAccess:'full',allowSelectBy:true});

const norm=v=>String(v??'').trim().toLowerCase();
function refNum(v){if(typeof v==='number')return v;if(Array.isArray(v)&&v[0]==='R')return Number(v[1]);const n=Number(v);return Number.isFinite(n)&&n>0?n:null}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function findLocTable(){const ts=await grist.docApi.listTables();for(const c of LOC_CAND)if(ts.includes(c))return c;for(const id of ts){try{const t=await grist.docApi.fetchTable(id),s=new Set(Object.keys(t));if(s.has('ParentLocationID')&&s.has('LocationID')&&s.has('Type'))return id}catch(e){}}return null}

function locLabel(r){return String(r?.Name||'').trim()||String(r?.LocationID||'').trim()||`Location ${r?.id}`}
function itemLabel(r){return String(r?.ItemName||'').trim()||String(r?.ItemID||'').trim()||`Item ${r?.id}`}
function locKids(id){return locRows.filter(r=>id==null?(!r.parentId||!locById.has(Number(r.parentId))):Number(r.parentId)===Number(id))}
function activeItems(id){return invRows.filter(r=>norm(r.Status)==='active'&&Number(r.locationRef)===Number(id))}
function ancestors(id){const a=[];let r=id==null?null:locById.get(Number(id)),seen=new Set();while(r&&!seen.has(r.id)){seen.add(r.id);a.push(r);r=r.parentId?locById.get(Number(r.parentId)):null}return a.reverse()}
function show(m,t='ok'){const e=document.getElementById('status');e.className='status '+t;e.textContent=m}
async function syncLoc(id){if(id==null)return;await Promise.allSettled([grist.setCursorPos({rowId:Number(id)}),grist.setSelectedRows([Number(id)])])}

function locSearchText(r){return [r.LocationID,r.Name,r.Description,r.Type].filter(Boolean).join(' ').toLowerCase()}
function itemSearchText(r){const vals=[];for(const [k,v] of Object.entries(r)){if(k==='id'||k==='locationRef'||v==null||v==='')continue;if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')vals.push(String(v))}const l=locById.get(Number(r.locationRef));if(l)vals.push(l.LocationID||'',l.Name||'',l.Description||'');return vals.join(' ').toLowerCase()}
function computeMatches(){locMatches=new Set();itemMatches=new Set();const s=norm(q);if(!s){document.getElementById('searchCount').textContent='';return}for(const r of locRows)if(locSearchText(r).includes(s))locMatches.add(Number(r.id));for(const r of invRows)if(norm(r.Status)==='active'&&itemSearchText(r).includes(s))itemMatches.add(Number(r.id));const n=locMatches.size+itemMatches.size;document.getElementById('searchCount').textContent=`${n} match${n===1?'':'es'}`}
function branchCount(id){let c=0,stack=[Number(id)],seen=new Set();while(stack.length){const cur=stack.pop();if(seen.has(cur))continue;seen.add(cur);if(locMatches.has(cur))c++;c+=invRows.filter(r=>norm(r.Status)==='active'&&Number(r.locationRef)===cur&&itemMatches.has(Number(r.id))).length;for(const k of locRows)if(Number(k.parentId)===cur)stack.push(Number(k.id))}return c}

async function load(){
  locTable=await findLocTable();if(!locTable)throw new Error('Location Inventory table not found');
  const [lt,it]=await Promise.all([grist.docApi.fetchTable(locTable),grist.docApi.fetchTable(INV)]);
  const lc=new Set(Object.keys(lt)),ic=new Set(Object.keys(it)),missing=[];
  if(!lc.has('Position'))missing.push('Location Inventory.Position');if(!ic.has('Position'))missing.push('Inventory.Position');if(!ic.has('LocationID'))missing.push('Inventory.LocationID');
  if(missing.length)show('Missing/recommended columns: '+missing.join(', '),'warn');
  locRows=lt.id.map((id,i)=>{const r={id};for(const [k,col] of Object.entries(lt))if(k!=='id'&&Array.isArray(col))r[k]=col[i];r.parentId=refNum(r.ParentLocationID);return r});
  invRows=it.id.map((id,i)=>{const r={id};for(const [k,col] of Object.entries(it))if(k!=='id'&&Array.isArray(col))r[k]=col[i];r.locationRef=refNum(r.LocationID);return r});
  locById=new Map(locRows.map(r=>[Number(r.id),r]));itemById=new Map(invRows.map(r=>[Number(r.id),r]));computeMatches();render();
}

function spec(){if(currentId==null){const n=locKids(null).length;return {cols:7,slots:Math.max(7,Math.ceil(Math.max(1,n)/7)*7)}}const p=locById.get(Number(currentId)),rr=Number(p?.Rows),cc=Number(p?.Columns);if(Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0)return {cols:cc,slots:rr*cc};const objs=[...locKids(currentId),...activeItems(currentId)],maxp=Math.max(0,...objs.map(o=>Number(o.Position)||0)),need=Math.max(objs.length,maxp,1);return {cols:7,slots:Math.max(7,Math.ceil(need/7)*7)}}
function objs(){if(currentId==null)return locKids(null).map(r=>({kind:'location',id:r.id,position:r.Position,data:r}));return [...locKids(currentId).map(r=>({kind:'location',id:r.id,position:r.Position,data:r})),...activeItems(currentId).map(r=>({kind:'item',id:r.id,position:r.Position,data:r}))]}
function assign(objects,slots){const used=new Set(),m=new Map();for(const o of objects){const p=Number(o.position);if(Number.isInteger(p)&&p>=1&&p<=slots&&!used.has(p)){m.set(`${o.kind}:${o.id}`,p);used.add(p)}}for(const o of objects){const k=`${o.kind}:${o.id}`;if(m.has(k))continue;let p=1;while(used.has(p))p++;m.set(k,p);used.add(p)}return m}
function firstFree(targetId){const p=locById.get(Number(targetId)),rr=Number(p?.Rows),cc=Number(p?.Columns),cap=(Number.isInteger(rr)&&rr>0&&Number.isInteger(cc)&&cc>0)?rr*cc:null,used=new Set();for(const r of locKids(targetId)){const x=Number(r.Position);if(Number.isInteger(x)&&x>0)used.add(x)}for(const r of activeItems(targetId)){const x=Number(r.Position);if(Number.isInteger(x)&&x>0)used.add(x)}let x=1;while(used.has(x))x++;return cap&&x>cap?null:x}

function renderCrumbs(){const e=document.getElementById('crumbs'),chain=ancestors(currentId);e.innerHTML='<button class="crumb" data-root="1">Root</button>'+chain.map(r=>`<span class="sep">›</span><button class="crumb" data-id="${r.id}">${esc(locLabel(r))}</button>`).join('');e.querySelector('[data-root]').onclick=()=>{currentId=null;render()};e.querySelectorAll('[data-id]').forEach(b=>{const id=Number(b.dataset.id);b.onclick=async()=>{currentId=id;render();await syncLoc(id)};b.ondragover=e=>{e.preventDefault();b.classList.add('drop-target')};b.ondragleave=()=>b.classList.remove('drop-target');b.ondrop=async e=>{e.preventDefault();b.classList.remove('drop-target');const d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind==='item')await relocateItem(Number(d.id),id)}})}
function renderHeader(){const e=document.getElementById('header');if(currentId==null){e.innerHTML='<div class="header"><div><div class="name">Top-level locations</div><div class="meta">Search highlights paths to matching locations and active items.</div></div></div>';return}const r=locById.get(Number(currentId));e.innerHTML=`<div class="header"><div><div class="name">${esc(locLabel(r))}</div><div class="meta">${esc(r.Type||'Location')} · ${esc(r.LocationID||'')}<br>${esc(r.Description||'')}</div></div><div class="meta">${locKids(r.id).length} child locations · ${activeItems(r.id).length} active items</div></div>`}

function tileHtml(o){if(o.kind==='location'){const r=o.data,b=branchCount(r.id);return `<div class="type">${esc(r.Type||'Location')}</div><div class="tname">${esc(locLabel(r))}</div><div class="tid">${esc(r.LocationID||'')}</div><div class="count">${locKids(r.id).length} locations · ${activeItems(r.id).length} items${b?` · ${b} matches below`:''}</div>`}const r=o.data;return `<div class="type">${esc(r.ItemType||'Inventory Item')}</div><div class="tname">${esc(itemLabel(r))}</div><div class="tid">${esc(r.ItemID||'')}</div><div class="count">${esc(r.Status||'')}</div>`}

function renderGrid(){const g=document.getElementById('grid'),objects=objs(),sp=spec(),pos=assign(objects,sp.slots),occ=new Map();for(const o of objects)occ.set(pos.get(`${o.kind}:${o.id}`),o);g.style.gridTemplateColumns=`repeat(${sp.cols},minmax(0,1fr))`;g.innerHTML='';for(let p=1;p<=sp.slots;p++){const o=occ.get(p),slot=document.createElement('div');slot.className='slot';slot.innerHTML=`<span class="slot-num">${p}</span>`;if(o){const t=document.createElement('button');const exact=o.kind==='location'?locMatches.has(Number(o.id)):itemMatches.has(Number(o.id)),path=o.kind==='location'&&branchCount(o.id)>0;t.className=`tile ${o.kind}`+(exact?' exactmatch':(!exact&&path?' pathmatch':''));t.draggable=true;t.innerHTML=tileHtml(o);if(o.kind==='location'){t.onclick=async()=>{currentId=Number(o.id);render();await syncLoc(currentId)};t.ondragover=e=>{e.preventDefault();e.stopPropagation()};t.ondrop=async e=>{e.preventDefault();e.stopPropagation();const d=JSON.parse(e.dataTransfer.getData('text/plain'));if(d.kind==='item')await relocateItem(Number(d.id),Number(o.id));else await swap(d,o,p)}}t.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({kind:o.kind,id:o.id,from:p,parent:currentId}));slot.appendChild(t)}slot.ondragover=e=>e.preventDefault();slot.ondrop=async e=>{e.preventDefault();const d=JSON.parse(e.dataTransfer.getData('text/plain')),target=occ.get(p);if(target)await swap(d,target,p);else await moveEmpty(d,p)};g.appendChild(slot)}}

async function moveEmpty(d,to){if(Number(d.from)===Number(to))return;try{await grist.getTable(d.kind==='location'?locTable:INV).update({id:Number(d.id),fields:{Position:Number(to)}});show(`Moved to position ${to}.`,'ok');await load()}catch(e){show('Move failed: '+(e.message||e),'err')}}
async function swap(d,target,to){if(d.kind==='item'&&target.kind==='location')return relocateItem(Number(d.id),Number(target.id));if(Number(d.from)===Number(to))return;try{await grist.docApi.applyUserActions([['UpdateRecord',d.kind==='location'?locTable:INV,Number(d.id),{Position:Number(to)}],['UpdateRecord',target.kind==='location'?locTable:INV,Number(target.id),{Position:Number(d.from)}]]);show('Positions swapped.','ok');await load()}catch(e){show('Swap failed: '+(e.message||e),'err')}}
async function relocateItem(itemId,targetId){const item=itemById.get(itemId),target=locById.get(targetId);if(!item||!target)return;const p=firstFree(targetId);if(p==null)return show(`${locLabel(target)} has no free grid positions.`,'warn');if(!confirm(`Move ${itemLabel(item)} into:\n\n${target.Description||locLabel(target)}\n\nPosition ${p}?`))return;try{await grist.getTable(INV).update({id:item.id,fields:{LocationID:target.id,Position:p}});show(`Moved ${itemLabel(item)} into ${locLabel(target)} at position ${p}.`,'ok');await load()}catch(e){show('Item relocation failed: '+(e.message||e),'err')}}

function jump(){if(locMatches.size){const id=[...locMatches][0];currentId=id;render();syncLoc(id);return}if(itemMatches.size){const item=itemById.get([...itemMatches][0]);if(item?.locationRef){currentId=item.locationRef;render();syncLoc(currentId)}}}
function render(){renderCrumbs();renderHeader();renderGrid();document.getElementById('upBtn').disabled=currentId==null}
document.getElementById('rootBtn').onclick=()=>{currentId=null;render()};document.getElementById('upBtn').onclick=async()=>{if(currentId==null)return;const r=locById.get(currentId);currentId=r?.parentId||null;render();if(currentId!=null)await syncLoc(currentId)};document.getElementById('refreshBtn').onclick=load;document.getElementById('search').oninput=e=>{q=e.target.value;computeMatches();render()};document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')jump()};document.getElementById('clearSearch').onclick=()=>{document.getElementById('search').value='';q='';computeMatches();render()};
(async()=>{try{await load()}catch(e){show('Storage map error: '+(e.message||e),'err')}})();
</script></body></html>
